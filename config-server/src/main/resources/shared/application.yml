eureka:
  client:
    service-url:
      defaultZone: http://localhost:8000/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  #zipkin tracing endpoint
  #1: pass all request trace to zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"

logging:
  level:
    root: info
  file:
    name: log/config/myapp.log
  logback:
    rollingpolicy:
      max-file-size: 2MB
  pattern:
    correlation:  "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  include-application-name: false


#oauth 2 security
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer
          issuer-uri: "http://localhost:9000"
          # public jwt keys
          jwk-set-uri: "http://localhost:9000/oauth2/jwks"
