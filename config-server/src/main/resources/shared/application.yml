logging:
  level:
    root: debug
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8000/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
